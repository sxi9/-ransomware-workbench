<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Samurai Scan</title>
<meta name="description" content="Ransomware victims, Needles, leak sites and daily investigator updates in one searchable, editable database.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0B2A3A;--ink-2:#3E5560;--ink-3:#6B808A;--chrome:#00172A;--chrome-2:#0A2A3D;--cyber:#24E4EB;
  --paper:#fff;--wash:#EEF3F5;--grid:#D8E1E4;--head:#E6EDEF;--hover:#F0F9FA;--sel:#DDF5F7;--accent:#0F7785;--accent-d:#0B5C67;
  --yes:#1C6A38;--yes-bg:#DDF1E3;--warn:#7A5200;--warn-bg:#FCEBC8;--bad:#A8201A;--bad-bg:#FBE3E1;--unk:#50656D;--unk-bg:#E6EDEF;--blue:#1F4E8C;--blue-bg:#DEE9F7;--purple:#5B3FA6;--purple-bg:#E9E2F8;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;--rh:34px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:400 13.5px/1.45 var(--sans);background:var(--wash);color:var(--ink);overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-variant-ligatures:none}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hide{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

.shell{display:flex;flex-direction:column;height:100vh}
.tabs{height:46px;flex:none;background:var(--chrome);color:#fff;display:flex;align-items:center;gap:2px;padding:0 12px;border-bottom:1px solid #0A2F44;overflow-x:auto}
.tabs .logo{font-weight:600;font-size:14px;margin-right:12px;white-space:nowrap;display:flex;align-items:center;gap:8px}
.tabs .logo b{color:var(--cyber)}
.tabs>button{height:46px;border:0;background:none;color:#B5C9D1;font-weight:500;font-size:13px;padding:0 13px;border-bottom:3px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tabs>button:hover{color:#fff;background:var(--chrome-2)}
.tabs>button.on{color:#fff;border-bottom-color:var(--cyber)}
.tabs>button .n{font-size:11px;color:#8FB0BC;font-variant-numeric:tabular-nums}
.tabs .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.tabs .stat{color:#8FB0BC;font-size:12px;white-space:nowrap;max-width:32vw;overflow:hidden;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:5px;border:1px solid var(--grid);background:var(--paper);color:var(--ink);font-weight:500;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.dark{border-color:#3A5A6B;background:transparent;color:#fff}.btn.dark:hover{background:var(--chrome-2)}
.btn.primary{background:var(--cyber);border-color:var(--cyber);color:var(--chrome)}.btn.primary:hover{background:#6FF0F5}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.accent:hover{background:var(--accent-d)}
.btn.danger{color:var(--bad);border-color:#E8B4B0}.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{height:28px;padding:0 10px;font-size:12.5px}
.btn.icon{width:32px;padding:0;justify-content:center}
.btn[disabled]{opacity:.5;cursor:default}
.ib{width:24px;height:24px;border-radius:4px;border:0;background:none;color:var(--ink-3);display:inline-flex;align-items:center;justify-content:center;padding:0;flex:none}
.ib:hover{background:var(--head);color:var(--ink)}
.ib.on{color:var(--accent)}

.hosts{flex:1;min-height:0;position:relative}
.host{position:absolute;inset:0;display:none;flex-direction:column}
.host.active{display:flex}

/* tab toolbar */
.bar{display:flex;gap:8px;align-items:center;padding:10px 14px 0;flex-wrap:wrap}
.bar h2{margin:0;font-size:15px;font-weight:600;white-space:nowrap}
.bar .meta{color:var(--ink-3);font-size:12.5px;white-space:nowrap}
.bar .sp{flex:1}
.qwrap{display:flex;gap:8px;align-items:center;padding:8px 14px 0}
.qbox{position:relative;flex:1;min-width:200px;display:flex;align-items:center;background:var(--paper);border:1px solid #B7C6CB;border-radius:6px;height:38px}
.qbox:focus-within{border-color:var(--accent);box-shadow:0 0 0 2px rgba(15,119,133,.18)}
.qbox svg.qi{margin-left:10px;color:var(--ink-3)}
.qbox input{flex:1;border:0;background:none;outline:none;height:100%;padding:0 10px;font-size:14px;min-width:0}
.qbox .ib{margin-right:6px}
.qbox .kbd{font:500 11px var(--mono);border:1px solid var(--grid);border-bottom-width:2px;border-radius:3px;padding:0 5px;color:var(--ink-3);margin-right:8px;background:var(--wash)}
.filters{display:flex;gap:6px;align-items:center;padding:8px 14px 0;flex-wrap:wrap}
.filters select,.filters input{height:30px;border:1px solid var(--grid);border-radius:5px;background:var(--paper);padding:0 8px;font-size:12.5px;max-width:230px}
.filters input[type=date]{width:140px}
.filters select.active,.filters input.active{border-color:var(--accent);background:var(--sel);font-weight:500}
.filters label{font-size:12px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.filters .lbl{font-size:12px;color:var(--ink-3)}
.hint{padding:4px 14px 0;font-size:12px;color:var(--ink-3)}
.hint kbd{font:500 11px var(--mono);border:1px solid var(--grid);border-bottom-width:2px;border-radius:3px;padding:0 4px;background:var(--paper)}
.tool{display:flex;gap:8px;align-items:center;padding:8px 14px;flex-wrap:wrap}
.tool .sum{font-size:13px;color:var(--ink-2)}
.tool .sum b{color:var(--ink);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--grid);border-radius:5px;background:var(--paper);overflow:hidden;flex:none}
.seg button{border:0;background:none;padding:0 11px;height:28px;font-size:12.5px;font-weight:500;color:var(--ink-2);display:inline-flex;align-items:center;gap:5px}
.seg button.on{background:var(--chrome);color:#fff}
.selbar{margin:0 14px;padding:6px 10px;background:var(--sel);border:1px solid #BFE6E9;border-radius:5px;display:flex;gap:8px;align-items:center;font-size:13px}

/* grid */
.gridwrap{flex:1;min-height:0;margin:0 14px 12px;display:flex;background:var(--paper);border:1px solid var(--grid);border-radius:6px;overflow:hidden;position:relative}
.gridmain{flex:1;min-width:0;display:flex;flex-direction:column}
.ghead{flex:none;overflow:hidden;background:var(--head);border-bottom:1px solid var(--grid)}
.ghead .hrow{display:flex;height:34px;width:max-content}
.gbody{flex:1;overflow:auto;position:relative}
.gbody .spacer{position:relative;width:max-content;min-width:100%}
.row{display:flex;height:var(--rh);position:absolute;left:0;width:max-content;min-width:100%;border-bottom:1px solid #EDF2F4;background:var(--paper)}
.row:hover{background:var(--hover)}
.row.sel{background:var(--sel)}
.row.on{box-shadow:inset 3px 0 0 var(--accent)}
.row.added{background:#F3FBF4}.row.edited .cell.ed{background:#FFF7E0}
.cell,.hcell{flex:none;padding:0 10px;height:100%;display:flex;align-items:center;overflow:hidden;white-space:nowrap;border-right:1px solid #EDF2F4;font-size:12.5px}
.cell>span,.cell>a{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.hcell{font-weight:600;font-size:12px;color:var(--ink-2);cursor:pointer;user-select:none;gap:4px;position:relative}
.hcell:hover{background:#DCE6E9}
.hcell .srt{color:var(--accent);font-size:11px}
.hcell .rz{position:absolute;right:-3px;top:0;width:6px;height:100%;cursor:col-resize}
.cell.chk,.hcell.chk{width:36px;justify-content:center;padding:0}
.cell.num{justify-content:flex-end;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:11.5px}
.cell a{color:var(--accent);text-decoration:none}
.cell a:hover{text-decoration:underline}
.cell .mono{font-size:11.5px}
.cell.edit{cursor:text}
.cell input,.cell select{width:100%;height:28px;border:1px solid var(--accent);border-radius:3px;padding:0 6px;font-size:12.5px;background:#fff}
.tor{display:inline-flex;align-items:center;gap:5px;min-width:0;cursor:copy}
.tor .tag{flex:none;font:500 10px var(--mono);background:var(--purple-bg);color:var(--purple);border-radius:3px;padding:1px 4px}
.tor .u{overflow:hidden;text-overflow:ellipsis;font-family:var(--mono);font-size:11.5px;color:var(--ink-2)}
.pill{display:inline-block;padding:1px 8px;border-radius:10px;font-size:11.5px;font-weight:500;background:var(--unk-bg);color:var(--unk);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill.yes{background:var(--yes-bg);color:var(--yes)}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.bad{background:var(--bad-bg);color:var(--bad)}.pill.blue{background:var(--blue-bg);color:var(--blue)}.pill.purple{background:var(--purple-bg);color:var(--purple)}
mark{background:#FFF1A8;color:inherit;border-radius:2px;padding:0}
.noresult{position:absolute;inset:34px 0 0;display:flex;align-items:center;justify-content:center;color:var(--ink-3);font-size:14px;flex-direction:column;gap:8px}

/* detail drawer */
.drawer{position:absolute;right:0;top:0;bottom:0;width:min(400px,100%);border-left:1px solid var(--grid);background:var(--paper);display:flex;flex-direction:column;min-height:0;box-shadow:-8px 0 24px rgba(0,23,42,.12);z-index:5}
.drawer .dh{display:flex;align-items:flex-start;gap:8px;padding:12px 14px 8px;border-bottom:1px solid var(--grid)}
.drawer .dh h3{margin:0;font-size:14px;font-weight:600;flex:1;line-height:1.3;word-break:break-word}
.drawer .db{flex:1;overflow:auto;padding:6px 0}
.kv{padding:6px 14px;border-bottom:1px solid #F0F4F6}
.kv .k{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.kv .k .ib{margin-left:auto;width:20px;height:20px}
.kv .v{font-size:13px;word-break:break-word;white-space:pre-wrap}
.kv .v a{word-break:break-all}
.kv .v.mono{font-size:12px}
.kv .v:empty::before{content:'—';color:var(--ink-3)}
.drawer h4{margin:12px 14px 4px;font-size:12px;color:var(--ink-2);text-transform:uppercase;letter-spacing:.03em}
.rel{padding:4px 14px}
.rel button{display:block;width:100%;text-align:left;border:0;background:none;padding:5px 6px;border-radius:4px;font-size:12.5px}
.rel button:hover{background:var(--hover)}
.rel small{color:var(--ink-3);margin-left:6px}
.drawer .df{padding:10px 14px;border-top:1px solid var(--grid);display:flex;gap:6px;flex-wrap:wrap}

/* modal / toast / menu */
.modal-bg{position:fixed;inset:0;background:rgba(0,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal{background:var(--paper);border-radius:8px;width:min(720px,100%);max-height:92vh;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,23,42,.35)}
.modal.wide{width:min(960px,100%)}
.modal .mh{display:flex;align-items:center;gap:8px;padding:14px 18px;border-bottom:1px solid var(--grid)}
.modal .mh h3{margin:0;font-size:16px;flex:1}
.modal .mb{padding:14px 18px;overflow:auto}
.modal .mf{padding:12px 18px;border-top:1px solid var(--grid);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 14px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--ink-2)}
.form label.full{grid-column:1/-1}
.form input,.form select,.form textarea{height:32px;border:1px solid var(--grid);border-radius:5px;padding:0 8px;font-size:13px;background:#fff;width:100%}
.form textarea{height:72px;padding:6px 8px;resize:vertical}
.form .chk{flex-direction:row;align-items:center;gap:6px}
.form .chk input{width:auto;height:auto}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--chrome);color:#fff;padding:9px 16px;border-radius:6px;font-size:13px;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}
.menu{position:fixed;background:var(--paper);border:1px solid var(--grid);border-radius:6px;box-shadow:0 8px 24px rgba(0,37,57,.18);z-index:150;min-width:200px;padding:4px;max-height:70vh;overflow:auto}
.menu button,.menu label{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:7px 10px;font-size:13px;border-radius:4px;cursor:pointer}
.menu button:hover,.menu label:hover{background:var(--hover)}
.menu hr{border:0;border-top:1px solid var(--grid);margin:4px 0}
.menu .h{padding:6px 10px 2px;font-size:11px;color:var(--ink-3);text-transform:uppercase}
.busy{position:fixed;inset:0;background:rgba(238,243,245,.85);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:300;font-size:14px;color:var(--ink-2)}
.spinner{width:34px;height:34px;border:3px solid var(--grid);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* dashboard */
.dash{flex:1;overflow:auto;padding:0 14px 14px}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin-top:10px}
.card{background:var(--paper);border:1px solid var(--grid);border-radius:6px;padding:12px 14px;cursor:pointer;text-align:left}
.card:hover{border-color:var(--accent)}
.card .n{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.card .l{font-size:12px;color:var(--ink-3);margin-top:4px}
.card.hi .n{color:var(--accent)}
.cols2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
@media (max-width:900px){.cols2{grid-template-columns:1fr}}
.panel{background:var(--paper);border:1px solid var(--grid);border-radius:6px;display:flex;flex-direction:column;min-height:0}
.panel .ph{padding:10px 14px;border-bottom:1px solid var(--grid);font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px}
.panel .ph .sp{flex:1}
.panel .pb{padding:4px 0;overflow:auto;max-height:420px}
.li{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12.5px;border:0;background:none;width:100%;text-align:left}
.li:hover{background:var(--hover)}
.li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .ct{color:var(--ink-3);font-variant-numeric:tabular-nums;font-size:12px}
.li .ct b{color:var(--ink)}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:#9FB0B6}.dot.Up{background:#1FA05A}.dot.Down{background:#A3B1B7}.dot.Seized{background:var(--bad)}.dot.Telegram{background:#2D8CFF}
.bars{padding:8px 14px}
.bars .b{display:grid;grid-template-columns:120px 1fr 44px;gap:8px;align-items:center;font-size:12px;padding:2px 0}
.bars .b .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .b .bar2{height:10px;background:var(--sel);border-radius:3px;position:relative}
.bars .b .bar2 i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px}
.bars .b .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}

/* investigator */
.inv{display:flex;flex-direction:column;flex:1;min-height:0}
.logform{margin:10px 14px 0;background:var(--paper);border:1px solid var(--grid);border-radius:6px;padding:12px 14px}
.logform .form input,.logform .form select{height:30px}
.logform .fh{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.logform .fh h3{margin:0;font-size:13.5px}
.logform .fh .sp{flex:1}
.daylog{flex:1;overflow:auto;margin:0 14px 12px;background:var(--paper);border:1px solid var(--grid);border-radius:6px}
.day{border-bottom:1px solid var(--grid)}
.day .dh{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--head);font-weight:600;position:sticky;top:0}
.day .dh .sp{flex:1}
.day .dh .pill{font-weight:500}
.ent{display:grid;grid-template-columns:62px 1fr auto;gap:10px;padding:8px 14px;border-top:1px solid #F0F4F6;font-size:12.5px;align-items:start}
.ent:hover{background:var(--hover)}
.ent .t{color:var(--ink-3);font-family:var(--mono);font-size:11.5px;padding-top:2px}
.ent .b b{font-weight:600}
.ent .b .nt{color:var(--ink-2);white-space:pre-wrap;margin-top:2px}
.ent .b .lk{display:flex;gap:10px;flex-wrap:wrap;margin-top:3px;font-size:12px}
.ent .a{display:flex;gap:2px}
.empty{padding:40px;text-align:center;color:var(--ink-3)}
@media (max-width:700px){.tabs .logo span{display:none}.tabs>button{padding:0 9px}.tabs .stat{display:none}.bar h2{font-size:14px}}
</style>
</head>

  <symbol id="i-layers" viewBox="0 0 24 24"><path d="m12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83Z"/><path d="m22 17.65-9.17 4.16a2 2 0 0 1-1.66 0L2 17.65"/><path d="m22 12.65-9.17 4.16a2 2 0 0 1-1.66 0L2 12.65"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/></symbol>
